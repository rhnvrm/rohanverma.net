# Zola Configuration for rohanverma.net
# Migrated from Hugo config.toml

# Basic site configuration
base_url = "https://rohanverma.net"
theme = "doordarshan"
title = "Rohan Verma"
description = "Personal website and blog of Rohan Verma, software developer at Zerodha Tech"
author = "Rohan Verma"
default_language = "en"

# Build configuration
compile_sass = true
minify_html = true
generate_feeds = true
feed_filenames = ["rss.xml"]
build_search_index = true

# Markdown configuration
[markdown]
highlight_code = true
highlight_theme = "css"
highlight_themes_css = [
  { theme = "gruvbox-dark", filename = "syntax-dark.css" },
  { theme = "gruvbox-light", filename = "syntax-light.css" },
]
render_emoji = true
external_links_target_blank = true
external_links_no_follow = true
external_links_no_referrer = true

# Taxonomies configuration
[[taxonomies]]
name = "tags"

[[taxonomies]]
name = "categories"

# Slugify configuration
[slugify]
paths = "on"
taxonomies = "on"
anchors = "on"

# Extra configuration
[extra]
author = "Rohan Verma"
bio = "I scribble about code, trains, and random rabbit‐holes."
avatar = "/images/avatar-github.png"
favicon = "/images/favicon.ico"
footer_message = "Feel free to use the content of this website with appropriate attribution to the author."
handwritten_font = "https://fonts.googleapis.com/css2?family=Shrikhand&display=swap"
nav_brand = "~/rhnvrm"

# Backward-compatible flat keys retained during theme contract migration.
github = "https://github.com/rhnvrm/"
twitter_handle = "@rhnvrm"

[extra.doordarshan.sections]
blog = "blog/_index.md"
pages = "pages/_index.md"

[extra.doordarshan.features]
pages_search = true
site_search = true

[extra.doordarshan.assets]
social_image = "images/social-card.png"

[extra.doordarshan.homepage]
show_recent = true
recent_limit = 5
reading_list_notes_feed_url = "https://reading-list.oddship.net/notes/rss.xml"
reading_list_digests_feed_url = "https://reading-list.oddship.net/digests/rss.xml"
reading_list_url = "https://reading-list.oddship.net/"

[[extra.doordarshan.homepage.links]]
