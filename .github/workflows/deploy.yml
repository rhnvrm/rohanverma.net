name: Trigger Deploy

on:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build site
        run: nix build

  trigger-deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Trigger nix-system deployment
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.NIX_SYSTEM_PAT }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/oddship/nix-system/dispatches \
            -d '{"event_type":"deploy-rohanverma-site"}'
