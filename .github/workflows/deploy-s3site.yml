name: Deploy via s3site (canary)

on:
  workflow_dispatch:

concurrency:
  group: deploy-rohanverma-s3site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build site
        run: nix build .#default

      - name: Create site archive
        run: tar czf rohanverma.net.tar.gz -C result .

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:gh-ci
          ping: rhnvrm-private

      - name: Upload archive to Garage
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3SITE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3SITE_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: garage
          AWS_EC2_METADATA_DISABLED: true
          S3SITE_BUCKET: static-sites
          S3SITE_ENDPOINT: http://rhnvrm-private:3900
        run: |
          set -euo pipefail
          nix shell nixpkgs#awscli2 -c aws \
            --endpoint-url "${S3SITE_ENDPOINT}" \
            s3api put-object \
            --bucket "${S3SITE_BUCKET}" \
            --key "sites/rohanverma.net.tar.gz" \
            --body rohanverma.net.tar.gz >/dev/null
          nix shell nixpkgs#awscli2 -c aws \
            --endpoint-url "${S3SITE_ENDPOINT}" \
            s3api head-object \
            --bucket "${S3SITE_BUCKET}" \
            --key "sites/rohanverma.net.tar.gz" >/dev/null

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "DEPLOY_SSH_KEY fingerprint:"
          ssh-keygen -lf ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Refresh s3site on oddship-web
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=accept-new \
            -o ServerAliveInterval=60 \
            -o ServerAliveCountMax=10 \
            rhnvrm@${{ secrets.DEPLOY_HOST }} \
            'set -euo pipefail
             for _ in $(seq 1 30); do
               if sudo systemctl is-active --quiet s3site && sudo test -S /run/s3site/control.sock; then
                 break
               fi
               sleep 2
             done
             sudo systemctl is-active --quiet s3site
             sudo /run/current-system/sw/bin/s3site refresh -socket /run/s3site/control.sock rohanverma.net
             curl -fsS -H "Host: rohanverma.net" http://127.0.0.1:9001/ >/dev/null'

      - name: Verify public site
        run: |
          curl -fsSI --retry 10 --retry-delay 3 https://rohanverma.net >/dev/null
          curl -fsSI -H 'Host: rohanverma.net' http://${{ secrets.DEPLOY_HOST }} >/dev/null
