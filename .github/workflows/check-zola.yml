name: Check Zola content
on:
  push:
    branches: [content/missing-github-projects]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install social card dependencies
        run: |
          python3 -m pip install Pillow==11.3.0
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core
      - name: Install pinned Zola and build
        run: |
          curl --fail --location --retry 3 https://github.com/getzola/zola/releases/download/v0.21.0/zola-v0.21.0-x86_64-unknown-linux-gnu.tar.gz -o /tmp/zola.tar.gz
          echo '5c37a8f706567d6cad3f0dbc0eaebe3b9591cc301bd67089e5ddc0d0401732d6  /tmp/zola.tar.gz' | sha256sum --check
          tar xzf /tmp/zola.tar.gz -C /tmp
          export PATH="/tmp:$PATH"
          bash scripts/build-site.sh
          python3 -m unittest discover -s scripts/tests
