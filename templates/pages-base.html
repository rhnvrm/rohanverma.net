<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{% if page.description %}{{ page.description }}{% elif section.description %}{{ section.description }}{% else %}{{ config.description }}{% endif %}">
    <meta name="author" content="{{ config.author }}">

    <title>{% block title %}{% if page.title %}{{ page.title }} | {{ config.title }}{% elif section.title %}{{ section.title }} | {{ config.title }}{% else %}{{ config.title }}{% endif %}{% endblock title %}</title>

    {% if config.extra.favicon %}
    <link rel="icon" href="{{ config.extra.favicon }}" type="image/x-icon">
    {% endif %}

    {% if config.generate_feeds %}
    <link rel="alternate" type="application/rss+xml" title="{{ config.title }}" href="{{ get_url(path="index.xml") }}">
    {% endif %}

    <link rel="canonical" href="{% if current_url %}{{ current_url }}{% else %}{{ config.base_url }}{% endif %}">

    <!-- Fonts: IBM Plex Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">

    <!-- oat.ink -->
    <link rel="stylesheet" href="https://unpkg.com/@knadh/oat/oat.min.css">

    <!-- Doordarshan ↔ oat bridge -->
    <link rel="stylesheet" href="{{ get_url(path='css/doordarshan-oat.css') }}">

    <!-- Syntax highlighting (gruvbox dark — always) -->
    <link rel="stylesheet" href="{{ get_url(path='syntax-dark.css') }}">

    <!-- Theme: detect and apply immediately to prevent flash -->
    <script>
        window.themeStore = {
            theme: localStorage.getItem('theme') ||
                   (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'),
            toggle() {
                this.theme = this.theme === 'dark' ? 'light' : 'dark';
                this.apply();
            },
            apply() {
                document.documentElement.setAttribute('data-theme', this.theme);
                localStorage.setItem('theme', this.theme);
            }
        };
        document.documentElement.setAttribute('data-theme', window.themeStore.theme);
    </script>
</head>
<body>
    {% block body %}{% endblock body %}

    <!-- oat.ink JS (sidebar toggle, tabs, etc.) -->
    <script src="https://unpkg.com/@knadh/oat/oat.min.js"></script>

    <!-- Footnotes: collapsible inline below referencing paragraph -->
    <script>
    (function() {
      var defs = document.querySelectorAll('.footnote-definition');
      if (!defs.length) return;

      defs.forEach(function(def) {
        var label = def.querySelector('.footnote-definition-label');
        if (!label) return;

        // Wrap content after label in collapsible body
        var body = document.createElement('div');
        body.className = 'footnote-body';
        while (label.nextSibling) {
          body.appendChild(label.nextSibling);
        }
        def.appendChild(body);

        // Toggle indicator
        var toggle = document.createElement('span');
        toggle.className = 'footnote-toggle';
        toggle.textContent = '▸';
        label.after(toggle);

        // Click to expand/collapse
        def.addEventListener('click', function(e) {
          if (e.target.tagName === 'A') return;
          def.classList.toggle('is-expanded');
        });
      });

      // Clicking superscript reference toggles its footnote
      document.querySelectorAll('.footnote-reference a').forEach(function(a) {
        a.addEventListener('click', function(e) {
          e.preventDefault();
          var targetId = a.getAttribute('href').replace('#', '');
          var targetDef = document.getElementById(targetId);
          if (targetDef) {
            targetDef.classList.toggle('is-expanded');
            targetDef.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
          }
        });
      });
    })();
    </script>

    {% block page_scripts %}{% endblock page_scripts %}
</body>
</html>
